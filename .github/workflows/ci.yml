name: CI

on:
  push:
    branches: [main, dev, testing]
  pull_request:
    branches: [main, dev, testing]

permissions:
  contents: write

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build doesn't connect to the DB, but the adapter reads these at
          # module load — provide harmless placeholders so the build succeeds.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          SESSION_SECRET: "ci-placeholder-session-secret-not-used-at-build"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

  release:
    name: Build APK & Release
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version is new
        id: version_check
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if git tag --list "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fallback web assets for cap sync
        if: steps.version_check.outputs.skip != 'true'
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>KaiwaAI</title>
            <style>
              html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0}
              .wrap{text-align:center;padding:2rem}
              h1{font-size:1.5rem;margin:0 0 1rem;color:#818cf8}
              p{margin:.5rem 0;color:#94a3b8;font-size:.95rem}
              a{color:#818cf8;text-decoration:underline}
              .spinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#818cf8;border-radius:50%;animation:spin 1s linear infinite;margin:1.5rem auto}
              @keyframes spin{to{transform:rotate(360deg)}}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>KaiwaAI</h1>
              <div class="spinner"></div>
              <p>Connecting to server…</p>
              <p id="err" style="display:none;color:#f87171">Could not reach server.<br/>Tap <a href="https://kaiwa-ai.vercel.app/" style="color:#fca5a5">here</a> to open in browser.</p>
            </div>
            <script>
              var TARGET = "https://kaiwa-ai.vercel.app/";
              var start = Date.now();
              function giveup() {
                document.getElementById("err").style.display = "block";
                document.querySelector(".spinner").style.display = "none";
              }
              var t = setTimeout(giveup, 8000);
              try {
                var img = new Image();
                img.onload = img.onerror = function() {
                  clearTimeout(t);
                  var elapsed = Date.now() - start;
                  setTimeout(function() { location.replace(TARGET); }, Math.max(0, 500 - elapsed));
                };
                img.src = TARGET + "icon.svg?cb=" + Date.now();
              } catch (e) {
                clearTimeout(t);
                location.replace(TARGET);
              }
            </script>
          </body>
          </html>
          HTML

      - uses: actions/setup-java@v4
        if: steps.version_check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        if: steps.version_check.outputs.skip != 'true'
        env:
          CAPACITOR_SERVER_URL: "https://kaiwa-ai.vercel.app"
        run: npx cap sync android

      - name: Decode and verify keystore
        if: steps.version_check.outputs.skip != 'true'
        env:
          KEYSTORE_HEX: ${{ secrets.KEYSTORE_HEX }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_HEX" ] && [ -z "$KEYSTORE_BASE64" ]; then
            missing="$missing KEYSTORE_HEX (or KEYSTORE_BASE64)"
          fi
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub secrets:$missing"
            exit 1
          fi

          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          KEYSTORE_PATH="android/app/kaiwaai-release.jks"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, sys

          def load_keystore_bytes() -> bytes:
              hex_raw = os.environ.get("KEYSTORE_HEX", "").strip()
              if hex_raw:
                  cleaned = re.sub(r"[^0-9a-fA-F]", "", hex_raw)
                  if len(cleaned) % 2 != 0:
                      print("ERROR: KEYSTORE_HEX has an odd number of hex characters.")
                      sys.exit(1)
                  data = bytes.fromhex(cleaned)
                  print(f"Loaded keystore from KEYSTORE_HEX ({len(cleaned)} hex chars)")
                  return data

              raw = os.environ["KEYSTORE_BASE64"].strip()
              if (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
                  raw = raw[1:-1]
              raw = re.sub(r"-----BEGIN[^-]+-----", "", raw)
              raw = re.sub(r"-----END[^-]+-----", "", raw)
              raw = re.sub(r"\s+", "", raw)
              if "-" in raw or "_" in raw:
                  raw = raw.replace("-", "+").replace("_", "/")
              raw = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
              try:
                  data = base64.b64decode(raw, validate=True)
              except Exception as exc:
                  print(f"ERROR: KEYSTORE_BASE64 is not valid base64: {exc}")
                  sys.exit(1)
              print("Loaded keystore from KEYSTORE_BASE64")
              return data

          data = load_keystore_bytes()
          if len(data) < 500:
              print(f"ERROR: Decoded keystore is too small ({len(data)} bytes).")
              sys.exit(1)

          keystore_path = pathlib.Path("android/app/kaiwaai-release.jks")
          keystore_path.write_bytes(data)
          print(f"Keystore size: {len(data)} bytes")
          print(f"Keystore SHA256: {hashlib.sha256(data).hexdigest()}")

          store_password = os.environ["KEYSTORE_PASSWORD"]
          key_alias = os.environ["KEY_ALIAS"]
          key_password = os.environ["KEY_PASSWORD"]

          result = subprocess.run(
              [
                  "keytool",
                  "-list",
                  "-v",
                  "-keystore",
                  str(keystore_path),
                  "-storepass",
                  store_password,
                  "-alias",
                  key_alias,
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode != 0:
              print("ERROR: Keystore validation failed.")
              print(result.stderr.strip() or result.stdout.strip())
              sys.exit(1)

          github_env = os.environ["GITHUB_ENV"]
          with open(github_env, "a", encoding="utf-8") as env_file:
              for name, value in [
                  ("KEYSTORE_PASSWORD", store_password),
                  ("KEY_ALIAS", key_alias),
                  ("KEY_PASSWORD", key_password),
              ]:
                  env_file.write(f"{name}<<EOF\n{value}\nEOF\n")
          PY

      - name: Build signed release APK
        if: steps.version_check.outputs.skip != 'true'
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --max-workers=2
        working-directory: android
        env:
          KEYSTORE_PATH: kaiwaai-release.jks
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Extract changelog for this version
        if: steps.version_check.outputs.skip != 'true'
        id: changelog
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' | tail -n +2)
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        if: steps.version_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "KaiwaAI v${{ steps.ver.outputs.version }}"
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
