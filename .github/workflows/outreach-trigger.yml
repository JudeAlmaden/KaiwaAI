name: Trigger Kai Outreach

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Call Outreach API
        run: |
          curl -X POST https://your-domain.vercel.app/api/triggers/kai-opener \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET }}" \
            -H "Content-Type: application/json"
